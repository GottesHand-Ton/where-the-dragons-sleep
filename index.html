<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./pictures\icon_novel.png" type="image/x-icon">
    <title>Фестиваль свиданий!</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- контейнер с игрй -->
    <main class="game-screen" id="game-screen">

        <div class="name-screen" id="name-screen">
            <div class="name-screen__window">
                <h1 class="name-screen__title">Приветствуем на фестивале свиданий!</h1>

                <label class="name-screen__label" for="player-name">
                    Ваше имя
                </label>
                <input class="name-screen__input" id="player-name" type="text" maxlength="20" placeholder="Введите имя"
                    autocomplete="new-password">
                <label class="name-screen__label" for="girl-name">
                    Имя девушки
                </label>
                <input class="name-screen__input" id="girl-name" type="text" maxlength="20" placeholder="Введите имя"
                    autocomplete="new-password">
                <button class="name-screen__button" id="start-game">
                    Начать игру
                </button>
            </div>
        </div>
        <div class="message-window message-window_hidden" id="message-window">
            <div class="message-window__content">
                <p class="message-window__text" id="message-text"></p>

                <button class="message-window__button" id="message-ok">
                    OK
                </button>
            </div>
        </div>

        <!-- Контейнер мини-игры -->
        <div class="minigame-container minigame_hidden" id="minigame-container">

            <div class="minigame-window">

                <!-- Таймер -->
                <div class="minigame-header">
                    <div class="minigame-timer" id="minigame-timer"></div>
                </div>

                <!-- Инструкция -->
                <p class="minigame-instructions" id="minigame-instructions">
                    Здесь должна быть инструкция
                </p>

                <!-- Область конкретной мини-игры -->
                <div id="minigame-content"></div>

                <!-- Выход -->
                <button class="minigame-close-btn" id="minigame-abort">
                    Сдаться
                </button>

            </div>

        </div>
        </div>

        <!-- блдюр -->
        <div class="game-screen__overlay" id="screen-overlay"></div>

        <!-- кнопки в сюжетных развилках -->
        <div class="dialogue-box__choices" id="choice-container"></div>

        <!-- обёртка диалогового окна -->
        <div class="game-screen__dialogue-wrapper">

            <!-- аватар говорящего -->
            <div class="game-screen__characters" id="character-layer">
                <img class="character character_position_left character_hidden" id="character-left" src="">
            </div>

            <!-- диалоговое окно -->
            <section class="dialogue-box" id="dialogue-box">

                <div class="dialogue-box__header" id="dialogue-header">

                    <!-- Имя говорящего -->
                    <div class="dialogue-box__speaker" id="speaker-name">
                        Имя Персонажа
                    </div>

                    <!-- панель быстрых кнопок  -->
                    <nav class="quick-menu dialogue-box__quick-menu" id="quick-menu">
                        <button class="quick-menu__btn" id="btn-back">Назад</button>
                        <button class="quick-menu__btn" id="btn-hide">Скрыть UI</button>
                        <button class="quick-menu__btn" id="btn-save">Сохранить</button>
                        <button class="quick-menu__btn" id="btn-load">Загрузить</button>
                    </nav>

                </div>

                <!-- Текст -->
                <p class="dialogue-box__text" id="dialogue-text">
                    Текст диалога располагается здесь...
                </p>

            </section>

        </div>

    </main>

    <script type="module" src="js/core.js"></script>
</body>

</html>
